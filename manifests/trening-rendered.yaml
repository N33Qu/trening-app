# Source: trening/templates/postgres.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: trening-postgres
  labels:
    app.kubernetes.io/name: trening-postgres
    app.kubernetes.io/part-of: trening
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: trening-0.1.0
spec:
  serviceName: trening-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: trening-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trening-postgres
        app.kubernetes.io/part-of: trening
        app.kubernetes.io/managed-by: Helm
        helm.sh/chart: trening-0.1.0
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "trening"
            - name: POSTGRES_USER
              value: "trening"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trening-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          startupProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
      volumes:
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi

