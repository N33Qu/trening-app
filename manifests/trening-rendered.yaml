# Source: trening/templates/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: trening-app
  labels:
    app.kubernetes.io/part-of: trening
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: trening-0.1.0
  annotations:
    cert-manager.io/cluster-issuer: trening-ca-issuer
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - trening.local
      secretName: trening-tls
  rules:
    - host: trening.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: trening-app
                port:
                  name: http

