apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: trening-app
  labels:
    app.kubernetes.io/part-of: trening
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: trening-0.1.0
spec:
