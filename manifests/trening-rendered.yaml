# Source: trening/templates/servicemonitor.yaml
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: trening-app
  labels:
    release: kube-prometheus-stack
    app.kubernetes.io/part-of: trening
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: trening-0.1.0
spec:
  groups:
    - name: trening.rules
      rules:
        - alert: TreningAppDown
          expr: (sum(up{namespace="trening", service="trening-app"}) or vector(0)) == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Aplikacja trening-app niedostepna"
            description: "Brak dzialajacych instancji trening-app od ponad 1 minuty."
        - alert: TreningHighErrorRate
          expr: |
            sum(rate(flask_http_request_total{namespace="trening", status=~"5.."}[5m]))
              / sum(rate(flask_http_request_total{namespace="trening"}[5m])) > 0.05
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Wysoki odsetek bledow 5xx"
            description: "Ponad 5% zapytan konczy sie bledem 5xx przez 5 minut."

