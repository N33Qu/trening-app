{{- if .Values.limitRange.enabled }}
apiVersion: v1
kind: LimitRange
metadata:
  name: trening-limits
  labels:
    {{- include "trening.labels" . | nindent 4 }}
spec:
  limits:
    - type: Container
      default:
        {{- toYaml .Values.limitRange.container.default | nindent 8 }}
      defaultRequest:
        {{- toYaml .Values.limitRange.container.defaultRequest | nindent 8 }}
      max:
        {{- toYaml .Values.limitRange.container.max | nindent 8 }}
    - type: PersistentVolumeClaim
      min:
        storage: {{ .Values.limitRange.pvc.min }}
      max:
        storage: {{ .Values.limitRange.pvc.max }}
{{- end }}
