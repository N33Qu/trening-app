apiVersion: v1
kind: Service
metadata:
  name: trening-app
  labels:
    app.kubernetes.io/name: trening-app
    {{- include "trening.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: trening-app
  ports:
    - name: http
