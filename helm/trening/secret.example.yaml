# PRZYKŁAD - struktura Secretu `trening-secrets` (wartości są zmyślonymi placeholderami).
# Prawdziwy Secret NIE jest przechowywany w repozytorium: tworzy go skrypt infra/create-secrets.sh
# (losowe wartości generowane przez `openssl rand`, `kubectl create secret generic ...`).
# Chart (Deployment, StatefulSet) odwołuje się do niego wyłącznie po nazwie (values.yaml: existingSecret).
# Ten plik nie jest częścią chartu (leży poza templates/), więc Helm/Argo CD go nie wdrażają.
apiVersion: v1
kind: Secret
metadata:
  name: trening-secrets
  namespace: trening
type: Opaque
stringData:
  POSTGRES_PASSWORD: "<losowe-haslo-bazy>"
  SECRET_KEY: "<losowy-klucz-flask-64-znaki-hex>"
  DATABASE_URL: "postgresql+psycopg://trening:<losowe-haslo-bazy>@trening-postgres:5432/trening"
