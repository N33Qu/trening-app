apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: trening-selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: trening-root-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: trening-root-ca
  secretName: trening-root-ca
  duration: 87600h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: trening-selfsigned
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: trening-ca-issuer
spec:
  ca:
    secretName: trening-root-ca
