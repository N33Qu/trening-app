{% extends "base.html" %}
{% from "_macros.html" import icon %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="error-page">
  <div class="code">{{ code }}</div>
  <h1>{{ title }}</h1>
  <p class="muted">{{ message }}</p>
  <a class="btn" href="{{ url_for('stats.dashboard') }}">{{ icon("arrow-left") }}{{ _('Wróć na pulpit') }}</a>
</div>
{% endblock %}
